<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Products</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-gray-100 p-10">
<h1 class="text-5xl font-bold mb-10 text-indigo-700">Manage Products</h1>
<div class="max-w-4xl mx-auto bg-white p-10 rounded-3xl shadow-2xl">
  <h2 class="text-3xl font-bold mb-6">Add New Product</h2>
  <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
    <input id="name" placeholder="Product Name" class="p-4 border-2 rounded-xl text-xl"/>
    <input id="price" type="number" placeholder="Price" class="p-4 border-2 rounded-xl text-xl"/>
    <input id="stock" type="number" placeholder="Stock" class="p-4 border-2 rounded-xl text-xl"/>
  </div>
  <button onclick="addProduct()" class="bg-indigo-600 text-white px-12 py-6 rounded-xl text-2xl font-bold hover:bg-indigo-700">ADD PRODUCT</button>
</div>

<div id="list" class="mt-10 grid gap-6 md:grid-cols-2 lg:grid-cols-3"></div>

<script type="module">
import { db } from "./firebase-config.js";
import { collection, addDoc, onSnapshot, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

window.addProduct = async () => {
  const name = document.getElementById("name").value.trim();
  const price = parseFloat(document.getElementById("price").value);
  const stock = parseInt(document.getElementById("stock").value);
  if (name && price > 0 && stock >= 0) {
    await addDoc(collection(db, "products"), { name, price, stock });
    document.getElementById("name").value = "";
    document.getElementById("price").value = "";
    document.getElementById("stock").value = "";
  }
};

onSnapshot(collection(db, "products"), snap => {
  const list = document.getElementById("list");
  list.innerHTML = "";
  snap.forEach(d => {
    const p = d.data(); p.id = d.id;
    const card = document.createElement("div");
    card.className = "bg-white p-6 rounded-2xl shadow-xl";
    card.innerHTML = `
      <h3 class="text-2xl font-bold">${p.name}</h3>
      <p class="text-3xl font-bold text-green-600">₹${p.price}</p>
      <p class="text-xl ${p.stock <= 5 ? 'text-red-600' : ''}">Stock: ${p.stock}</p>
      <button onclick="deleteDoc(doc(db,'products','${p.id}'))" class="mt-4 bg-red-600 text-white px-6 py-3 rounded-xl">Delete</button>
    `;
    list.appendChild(card);
  });
});
</script>
</body></html>
