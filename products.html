<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Products Management</title><script src="https://cdn.tailwindcss.com"></script><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"></head>
<body class="bg-gray-100 p-6 md:p-10">
<div class="max-w-7xl mx-auto">
  <div class="flex justify-between items-center mb-10">
    <h1 class="text-4xl md:text-5xl font-bold text-indigo-700">Manage Products</h1>
    <a href="index.html" class="bg-indigo-600 text-white px-6 py-3 rounded-xl font-bold hover:bg-indigo-700"><i class="fas fa-arrow-left mr-2"></i>Back to POS</a>
  </div>

  <div class="max-w-6xl mx-auto bg-white p-8 md:p-10 rounded-3xl shadow-2xl mb-10">
    <h2 class="text-2xl md:text-3xl font-bold mb-6">Add New Product</h2>
    
    <!-- Basic Product Info -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-4">
      <input id="name" placeholder="Product Name *" class="p-4 border-2 rounded-xl text-lg" required/>
      <input id="barcode" placeholder="Barcode (scan or type)" class="p-4 border-2 rounded-xl text-lg" autofocus/>
      <input id="category" placeholder="Category" class="p-4 border-2 rounded-xl text-lg"/>
      <select id="unit" class="p-4 border-2 rounded-xl text-lg">
        <option value="">Unit: Pieces (default)</option>
        <option value="kg">Kilogram (kg)</option>
        <option value="g">Gram (g)</option>
        <option value="l">Liter (l)</option>
        <option value="ml">Milliliter (ml)</option>
      </select>
    </div>
    
    <!-- Pricing & Stock Info -->
    <div class="grid grid-cols-1 md:grid-cols-5 gap-4 mb-4">
      <input id="buyingPrice" type="number" step="0.01" placeholder="Buying Price (LKR) *" class="p-4 border-2 rounded-xl text-lg" required min="0"/>
      <input id="sellingPrice" type="number" step="0.01" placeholder="Selling Price (LKR) *" class="p-4 border-2 rounded-xl text-lg" required min="0"/>
      <input id="stock" type="number" placeholder="Quantity *" class="p-4 border-2 rounded-xl text-lg" required min="0"/>
      <input id="freeItems" type="number" placeholder="Free Items" class="p-4 border-2 rounded-xl text-lg" min="0" value="0"/>
      <div class="p-4 border-2 rounded-xl text-lg bg-green-50 font-bold text-green-700" id="profitDisplay">
        Profit: LKR 0.00
      </div>
    </div>
    
    <!-- Purchase Details -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
      <input id="purchaseDate" type="date" class="p-4 border-2 rounded-xl text-lg" />
      <input id="supplierName" placeholder="Supplier Name" class="p-4 border-2 rounded-xl text-lg"/>
      <input id="supplierDetails" placeholder="Supplier Contact/Notes" class="p-4 border-2 rounded-xl text-lg"/>
    </div>
    
    <button onclick="addProduct()" class="w-full bg-indigo-600 text-white px-12 py-5 rounded-xl text-xl md:text-2xl font-bold hover:bg-indigo-700">
      <i class="fas fa-plus mr-2"></i>ADD PRODUCT
    </button>
  </div>

  <div class="mb-6">
    <input type="text" id="searchProducts" placeholder="Search products..." class="w-full p-4 border-2 rounded-xl text-xl">
  </div>

  <div id="list" class="grid gap-6 md:grid-cols-2 lg:grid-cols-3"></div>
</div>

<script type="module">
import { db, auth } from "./firebase-config.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
import { collection, addDoc, onSnapshot, doc, deleteDoc, updateDoc, increment, query, where, getDocs, getDoc } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

// Check authentication and role
onAuthStateChanged(auth, async user => {
  if (!user) {
    alert("Please login first!");
    window.location.href = "index.html";
    return;
  }
  
  // Check if user is admin
  const userDoc = await getDoc(doc(db, "users", user.uid));
  if (!userDoc.exists() || userDoc.data().role !== "admin") {
    alert("Access Denied! Only admins can manage products.");
    window.location.href = "index.html";
    return;
  }
});

let allProducts = [];

// Calculate and display profit when prices change
function updateProfitDisplay() {
  const buyingPrice = parseFloat(document.getElementById("buyingPrice")?.value) || 0;
  const sellingPrice = parseFloat(document.getElementById("sellingPrice")?.value) || 0;
  const stock = parseInt(document.getElementById("stock")?.value) || 0;
  const freeItems = parseInt(document.getElementById("freeItems")?.value) || 0;
  
  const profitPerItem = sellingPrice - buyingPrice;
  const totalProfit = profitPerItem * stock;
  
  const profitDisplay = document.getElementById("profitDisplay");
  if (profitDisplay) {
    profitDisplay.innerHTML = `
      Profit/Item: <span class="${profitPerItem >= 0 ? 'text-green-700' : 'text-red-700'}">${profitPerItem.toFixed(2)}</span><br>
      Total: <span class="${totalProfit >= 0 ? 'text-green-700' : 'text-red-700'}">LKR ${totalProfit.toFixed(2)}</span>
    `;
  }
}

// Add event listeners after DOM loads
setTimeout(() => {
  ['buyingPrice', 'sellingPrice', 'stock', 'freeItems'].forEach(id => {
    const elem = document.getElementById(id);
    if (elem) {
      elem.addEventListener('input', updateProfitDisplay);
    }
  });
  
  // Set default purchase date to today
  const purchaseDateInput = document.getElementById('purchaseDate');
  if (purchaseDateInput) {
    purchaseDateInput.valueAsDate = new Date();
  }
  
  // Barcode auto-fill functionality
  const barcodeInput = document.getElementById('barcode');
  if (barcodeInput) {
    barcodeInput.addEventListener('change', async function() {
      const barcode = this.value.trim();
      if (!barcode) return;
      
      try {
        const q = query(collection(db, "products"), where("barcode", "==", barcode));
        const snapshot = await getDocs(q);
        
        if (!snapshot.empty) {
          const existingProduct = snapshot.docs[0].data();
          const fillData = confirm(`Product "${existingProduct.name}" found with this barcode!\n\nDo you want to auto-fill the product details?\n(You can then update with new prices if needed)`);
          
          if (fillData) {
            document.getElementById('name').value = existingProduct.name;
            document.getElementById('category').value = existingProduct.category || '';
            document.getElementById('buyingPrice').value = existingProduct.buyingPrice || existingProduct.price || '';
            document.getElementById('sellingPrice').value = existingProduct.sellingPrice || existingProduct.price || '';
            updateProfitDisplay();
          }
        }
      } catch (error) {
        console.error("Error checking barcode:", error);
      }
    });
  }
}, 500);

window.addProduct = async () => {
  const name = document.getElementById("name").value.trim();
  const barcode = document.getElementById("barcode").value.trim();
  const category = document.getElementById("category").value.trim();
  const unit = document.getElementById("unit").value;
  const buyingPrice = parseFloat(document.getElementById("buyingPrice").value);
  const sellingPrice = parseFloat(document.getElementById("sellingPrice").value);
  const stock = parseFloat(document.getElementById("stock").value); // Changed to parseFloat for weight support
  const freeItems = parseInt(document.getElementById("freeItems").value) || 0;
  const purchaseDate = document.getElementById("purchaseDate").value;
  const supplierName = document.getElementById("supplierName").value.trim();
  const supplierDetails = document.getElementById("supplierDetails").value.trim();
  
  if (!name) return alert("Please enter product name");
  if (isNaN(buyingPrice) || buyingPrice < 0) return alert("Please enter valid buying price (LKR)");
  if (isNaN(sellingPrice) || sellingPrice <= 0) return alert("Please enter valid selling price (LKR)");
  if (isNaN(stock) || stock < 0) return alert("Please enter valid stock quantity");

  try {
    // Calculate profit
    const profitPerItem = sellingPrice - buyingPrice;
    const totalProfit = profitPerItem * stock;
    
    // Check if product with same name exists
    const q = query(collection(db, "products"), where("name", "==", name));
    const snapshot = await getDocs(q);
    
    if (!snapshot.empty && !barcode) {
      // Product exists without barcode scan - ask what to do
      const existingDoc = snapshot.docs[0];
      const existingData = existingDoc.data();
      
      if (confirm(`Product "${name}" already exists with stock: ${existingData.stock}.\n\nDo you want to ADD ${stock} units to the existing stock?`)) {
        // Update existing product stock
        await updateDoc(doc(db, "products", existingDoc.id), { 
          stock: increment(stock),
          buyingPrice: buyingPrice,
          sellingPrice: sellingPrice,
          price: sellingPrice, // Keep for backward compatibility
          category: category || existingData.category || "",
          unit: unit || existingData.unit || "",
          freeItems: (existingData.freeItems || 0) + freeItems,
          lastPurchaseDate: purchaseDate || new Date().toISOString().split('T')[0],
          lastSupplier: supplierName || existingData.lastSupplier || ""
        });
        alert(`Stock updated! New total: ${existingData.stock + stock} units`);
      } else {
        return;
      }
    } else if (!snapshot.empty && barcode) {
      // Product exists with same name and barcode - this might be new price point
      const existingDoc = snapshot.docs[0];
      const existingData = existingDoc.data();
      
      const priceChanged = existingData.buyingPrice !== buyingPrice || existingData.sellingPrice !== sellingPrice;
      
      if (priceChanged) {
        const action = confirm(`This product exists but with different prices!\n\nExisting: Buy ${existingData.buyingPrice} / Sell ${existingData.sellingPrice}\nNew: Buy ${buyingPrice} / Sell ${sellingPrice}\n\nClick OK to add as NEW price point with separate stock\nClick Cancel to update existing product`);
        
        if (action) {
          // Add as new price variant
          await addDoc(collection(db, "products"), { 
            name, 
            barcode: barcode || "",
            category: category || "",
            unit: unit || "",
            buyingPrice,
            sellingPrice,
            price: sellingPrice, // For backward compatibility
            stock,
            freeItems,
            profitPerItem,
            totalProfit,
            purchaseDate: purchaseDate || new Date().toISOString().split('T')[0],
            supplierName: supplierName || "",
            supplierDetails: supplierDetails || "",
            priceVariant: true,
            parentProduct: name,
            createdAt: new Date()
          });
          alert("Product added as new price variant!");
        } else {
          // Update existing
          await updateDoc(doc(db, "products", existingDoc.id), { 
            stock: increment(stock),
            buyingPrice: buyingPrice,
            sellingPrice: sellingPrice,
            price: sellingPrice,
            category: category || existingData.category || "",
            freeItems: (existingData.freeItems || 0) + freeItems
          });
          alert(`Stock updated! New total: ${existingData.stock + stock} units`);
        }
      } else {
        // Same prices, just add stock
        await updateDoc(doc(db, "products", existingDoc.id), { 
          stock: increment(stock),
          freeItems: (existingData.freeItems || 0) + freeItems
        });
        alert(`Stock updated! New total: ${existingData.stock + stock} units`);
      }
    } else {
      // Add new product
      await addDoc(collection(db, "products"), { 
        name, 
        barcode: barcode || "",
        category: category || "",
        unit: unit || "",
        buyingPrice,
        sellingPrice,
        price: sellingPrice, // For backward compatibility  
        stock,
        freeItems,
        profitPerItem,
        totalProfit,
        purchaseDate: purchaseDate || new Date().toISOString().split('T')[0],
        supplierName: supplierName || "",
        supplierDetails: supplierDetails || "",
        createdAt: new Date()
      });
      alert("Product added successfully!");
    }
    
    // Clear form
    document.getElementById("name").value = "";
    document.getElementById("barcode").value = "";
    document.getElementById("category").value = "";
    document.getElementById("buyingPrice").value = "";
    document.getElementById("sellingPrice").value = "";
    document.getElementById("stock").value = "";
    document.getElementById("freeItems").value = "0";
    document.getElementById("supplierName").value = "";
    document.getElementById("supplierDetails").value = "";
    document.getElementById("purchaseDate").valueAsDate = new Date();
    updateProfitDisplay();
    
    // Re-focus barcode for next entry
    document.getElementById("barcode").focus();
  } catch (error) {
    alert("Error: " + error.message);
    console.error("Product add error:", error);
  }
};

window.updateStock = async (id, currentStock) => {
  const newStock = prompt(`Current stock: ${currentStock}\n\nEnter stock quantity to ADD:`, "0");
  if (newStock !== null) {
    const stockToAdd = parseInt(newStock);
    if (!isNaN(stockToAdd) && stockToAdd > 0) {
      try {
        await updateDoc(doc(db, "products", id), { stock: increment(stockToAdd) });
        alert(`Stock updated! Added ${stockToAdd} units.`);
      } catch (error) {
        alert("Error updating stock: " + error.message);
      }
    }
  }
};

window.editProduct = async (id) => {
  try {
    // Get current product data
    const productDoc = await getDoc(doc(db, "products", id));
    if (!productDoc.exists()) {
      alert("Product not found!");
      return;
    }
    
    const currentData = productDoc.data();
    
    const newName = prompt("Product Name:", currentData.name);
    if (!newName) return;
    
    const newBuyingPrice = prompt("Buying Price (LKR):", currentData.buyingPrice || currentData.price || "");
    if (!newBuyingPrice || isNaN(parseFloat(newBuyingPrice))) return;
    
    const newSellingPrice = prompt("Selling Price (LKR):", currentData.sellingPrice || currentData.price || "");
    if (!newSellingPrice || isNaN(parseFloat(newSellingPrice))) return;
    
    const newBarcode = prompt("Barcode (optional):", currentData.barcode || "");
    const newCategory = prompt("Category (optional):", currentData.category || "");
    
    const buyingPrice = parseFloat(newBuyingPrice);
    const sellingPrice = parseFloat(newSellingPrice);
    const profitPerItem = sellingPrice - buyingPrice;
    
    await updateDoc(doc(db, "products", id), { 
      name: newName, 
      buyingPrice: buyingPrice,
      sellingPrice: sellingPrice,
      price: sellingPrice, // Keep for backward compatibility
      profitPerItem: profitPerItem,
      barcode: newBarcode || "",
      category: newCategory || ""
    });
    alert("Product updated successfully!");
  } catch (error) {
    alert("Error: " + error.message);
  }
};

window.deleteProduct = async (id, name) => {
  if (confirm(`Are you sure you want to delete "${name}"?`)) {
    try {
      await deleteDoc(doc(db, "products", id));
      alert("Product deleted!");
    } catch (error) {
      alert("Error: " + error.message);
    }
  }
};

function renderProducts(products) {
  const list = document.getElementById("list");
  list.innerHTML = "";
  
  if (products.length === 0) {
    list.innerHTML = "<p class='text-2xl text-gray-500 col-span-full text-center'>No products found</p>";
    return;
  }
  
  products.forEach(p => {
    const card = document.createElement("div");
    card.className = `bg-white p-6 rounded-2xl shadow-xl ${p.stock <= 5 ? 'border-4 border-red-500' : ''}`;
    
    // Create elements to avoid innerHTML with user data
    const headerDiv = document.createElement("div");
    headerDiv.className = "flex justify-between items-start mb-4";
    
    const titleDiv = document.createElement("div");
    const title = document.createElement("h3");
    title.className = "text-2xl font-bold";
    title.textContent = p.name; // Safe: uses textContent
    titleDiv.appendChild(title);
    
    if (p.barcode) {
      const barcodeP = document.createElement("p");
      barcodeP.className = "text-sm text-gray-500";
      barcodeP.textContent = `Barcode: ${p.barcode}`; // Safe: uses textContent
      titleDiv.appendChild(barcodeP);
    }
    
    if (p.category) {
      const categoryP = document.createElement("p");
      categoryP.className = "text-xs text-indigo-600 mt-1";
      categoryP.textContent = `📁 ${p.category}`;
      titleDiv.appendChild(categoryP);
    }
    
    const idSpan = document.createElement("span");
    idSpan.className = "text-xs bg-gray-200 px-2 py-1 rounded";
    idSpan.textContent = `#${p.id.slice(0,6)}`;
    
    headerDiv.appendChild(titleDiv);
    headerDiv.appendChild(idSpan);
    card.appendChild(headerDiv);
    
    // Price info
    const priceDiv = document.createElement("div");
    priceDiv.className = "mb-3";
    
    if (p.buyingPrice !== undefined && p.sellingPrice !== undefined) {
      const buyP = document.createElement("p");
      buyP.className = "text-sm text-gray-600";
      buyP.textContent = `Buy: LKR ${p.buyingPrice.toFixed(2)}`;
      priceDiv.appendChild(buyP);
      
      const sellP = document.createElement("p");
      sellP.className = "text-2xl font-bold text-green-600";
      sellP.textContent = `Sell: LKR ${p.sellingPrice.toFixed(2)}`;
      priceDiv.appendChild(sellP);
      
      const profitPerItem = p.sellingPrice - p.buyingPrice;
      const profitP = document.createElement("p");
      profitP.className = `text-sm font-semibold ${profitPerItem >= 0 ? 'text-green-700' : 'text-red-700'}`;
      profitP.textContent = `Profit: LKR ${profitPerItem.toFixed(2)}/item`;
      priceDiv.appendChild(profitP);
    } else {
      // Legacy products with just price
      const priceP = document.createElement("p");
      priceP.className = "text-3xl font-bold text-green-600";
      priceP.textContent = `LKR ${(p.price || p.sellingPrice || 0).toFixed(2)}`;
      priceDiv.appendChild(priceP);
    }
    card.appendChild(priceDiv);
    
    // Stock
    const stockP = document.createElement("p");
    stockP.className = `text-xl font-bold mt-2 ${p.stock <= 5 ? 'text-red-600 animate-pulse' : p.stock <= 10 ? 'text-orange-600' : 'text-gray-700'}`;
    stockP.textContent = `Stock: ${p.stock}${p.freeItems ? ` (+ ${p.freeItems} free)` : ''}${p.stock <= 5 ? ' ⚠️ Low!' : ''}`;
    card.appendChild(stockP);
    
    // Supplier & Purchase info
    if (p.supplierName || p.purchaseDate) {
      const supplierDiv = document.createElement("div");
      supplierDiv.className = "mt-3 text-xs text-gray-500 border-t pt-2";
      
      if (p.supplierName) {
        const supplierP = document.createElement("p");
        supplierP.textContent = `Supplier: ${p.supplierName}`;
        supplierDiv.appendChild(supplierP);
      }
      
      if (p.purchaseDate) {
        const dateP = document.createElement("p");
        dateP.textContent = `Purchased: ${p.purchaseDate}`;
        supplierDiv.appendChild(dateP);
      }
      
      card.appendChild(supplierDiv);
    }
    
    if (p.priceVariant) {
      const variantBadge = document.createElement("span");
      variantBadge.className = "inline-block bg-purple-100 text-purple-700 text-xs px-2 py-1 rounded mt-2";
      variantBadge.textContent = "Price Variant";
      card.appendChild(variantBadge);
    }
    
    // Buttons container
    const buttonsDiv = document.createElement("div");
    buttonsDiv.className = "mt-4 grid grid-cols-2 gap-2";
    
    // Add Stock button
    const addStockBtn = document.createElement("button");
    addStockBtn.className = "bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 text-sm font-bold";
    addStockBtn.innerHTML = '<i class="fas fa-plus-circle mr-1"></i>Add Stock';
    addStockBtn.onclick = () => updateStock(p.id, p.stock);
    buttonsDiv.appendChild(addStockBtn);
    
    // Edit button
    const editBtn = document.createElement("button");
    editBtn.className = "bg-yellow-600 text-white px-4 py-2 rounded-lg hover:bg-yellow-700 text-sm font-bold";
    editBtn.innerHTML = '<i class="fas fa-edit mr-1"></i>Edit';
    editBtn.onclick = () => editProduct(p.id);
    buttonsDiv.appendChild(editBtn);
    
    card.appendChild(buttonsDiv);
    
    // Delete button
    const deleteBtn = document.createElement("button");
    deleteBtn.className = "mt-2 w-full bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700 text-sm font-bold";
    deleteBtn.innerHTML = '<i class="fas fa-trash mr-1"></i>Delete';
    deleteBtn.onclick = () => deleteProduct(p.id, p.name);
    card.appendChild(deleteBtn);
    
    list.appendChild(card);
  });
}

onSnapshot(collection(db, "products"), snap => {
  allProducts = [];
  snap.forEach(d => {
    const p = d.data(); 
    p.id = d.id;
    allProducts.push(p);
  });
  renderProducts(allProducts);
});

document.getElementById("searchProducts").addEventListener("input", (e) => {
  const term = e.target.value.toLowerCase();
  const filtered = allProducts.filter(p => 
    p.name.toLowerCase().includes(term) || 
    (p.barcode && p.barcode.toLowerCase().includes(term))
  );
  renderProducts(filtered);
});
</script>
</body></html>
