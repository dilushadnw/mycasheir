<!DOCTYPE html><html><head><title>Report</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-gray-100 p-10">
<h1 class="text-4xl font-bold mb-8">Today's Sales Report</h1>
<div id="report" class="bg-white p-8 rounded-xl shadow"></div>
<script type="module">
import { db } from "./firebase-config.js";
import { collection, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

const today = new Date().toISOString().slice(0,10);
onSnapshot(query(collection(db, "sales"), where("timestamp", ">=", today)), snap => {
  let total = 0;
  const div = document.getElementById("report");
  div.innerHTML = "<h2 class='text-2xl font-bold mb-4'>Sales Today</h2>";
  snap.forEach(s => {
    const data = s.data();
    total += data.total;
    div.innerHTML += `<div class="border-b py-3">₹${data.total.toFixed(2)} - ${new Date(data.timestamp?.toDate()).toLocaleString()}</div>`;
  });
  div.innerHTML += `<div class="text-3xl font-bold text-green-600 mt-6">TOTAL TODAY: ₹${total.toFixed(2)}</div>`;
});
</script>
</body></html>
