<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Shop Cashier Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100">

<!-- LOGIN -->
<div id="loginScreen" class="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-600 to-purple-700">
  <div class="bg-white p-12 rounded-3xl shadow-2xl w-96 text-center">
    <div class="mb-8">
      <i class="fas fa-cash-register text-6xl text-indigo-700 mb-4"></i>
      <h1 class="text-5xl font-bold text-indigo-700">Shop Cashier Pro</h1>
    </div>
    <div id="loginError" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-xl mb-4"></div>
    <input type="email" id="email" class="w-full p-4 text-xl border-2 rounded-xl mb-4" placeholder="Email" autocomplete="email"/>
    <input type="password" id="password" class="w-full p-4 text-xl border-2 rounded-xl mb-6" placeholder="Password" autocomplete="current-password"/>
    <button onclick="login()" class="w-full bg-indigo-600 text-white py-5 rounded-xl text-2xl font-bold hover:bg-indigo-700 transition">
      <i class="fas fa-sign-in-alt mr-2"></i>LOGIN
    </button>
    <div class="mt-6 text-sm text-gray-600">
      <p class="font-bold mb-2">Demo Accounts:</p>
      <p>Admin: admin@shop.com / admin123</p>
      <p>Cashier: cashier@shop.com / cashier123</p>
    </div>
  </div>
</div>

<!-- MAIN APP -->
<div id="app" class="hidden min-h-screen">
  <header class="bg-gradient-to-r from-indigo-700 to-purple-700 text-white p-6 shadow-xl">
    <div class="flex justify-between items-center">
      <div>
        <h1 class="text-4xl font-bold" id="shopName">My Shop</h1>
        <p class="text-xl" id="shopAddress">Loading...</p>
      </div>
      <div class="flex gap-4 items-center">
        <span id="userRole" class="bg-yellow-400 text-gray-900 px-4 py-2 rounded-xl font-bold text-sm"></span>
        <a href="products.html" id="productsLink" class="bg-white text-indigo-700 px-6 py-3 rounded-xl font-bold hover:bg-gray-100 transition">
          <i class="fas fa-box mr-2"></i>Products
        </a>
        <a href="report.html" class="bg-white text-indigo-700 px-6 py-3 rounded-xl font-bold hover:bg-gray-100 transition">
          <i class="fas fa-chart-bar mr-2"></i>Reports
        </a>
        <button onclick="logout()" class="bg-red-600 hover:bg-red-700 px-6 py-3 rounded-xl font-bold transition">
          <i class="fas fa-sign-out-alt mr-2"></i>Logout
        </button>
      </div>
    </div>
  </header>

  <div class="flex flex-col lg:flex-row h-screen">
    <!-- Products -->
    <div class="w-full lg:w-2/3 p-6 bg-gray-50">
      <input type="text" id="search" placeholder="Search product or SCAN BARCODE..." class="w-full p-6 text-2xl border-4 border-indigo-300 rounded-2xl focus:outline-none focus:border-indigo-600" autofocus/>
      <div id="productsGrid" class="grid grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-6 mt-8"></div>
    </div>

    <!-- Cart -->
    <div class="w-full lg:w-1/3 bg-white shadow-2xl p-8 flex flex-col">
      <h2 class="text-4xl font-bold mb-4">Cart (<span id="cartCount">0</span>)</h2>
      <div id="cartItems" class="flex-1 overflow-y-auto space-y-3 mb-6"></div>

      <div class="border-t-4 border-indigo-600 pt-6 space-y-5 text-2xl">
        <div class="flex justify-between font-bold text-3xl text-green-600">
          <span>TOTAL</span><span id="total">₹0.00</span>
        </div>
        <input type="number" id="cashTendered" placeholder="Cash Tendered" class="w-full p-5 border-4 rounded-xl text-3xl text-right"/>
        <div class="text-4xl font-bold text-green-600">Change: <span id="change">₹0.00</span></div>
        <button onclick="completeSale()" class="w-full bg-green-600 hover:bg-green-700 text-white py-10 text-4xl font-bold rounded-2xl shadow-xl">
          COMPLETE SALE
        </button>
      </div>
    </div>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
